    <style>
        body{
             background: linear-gradient(235deg, #ffe98a, #beb1f7);
        }
        div.slogan {
            text-align: center;
            display: inline-block;
            margin: 10px;
            width: 15%;
            padding: 3px;
            font-family: '黑体';
            font-size: 20px;
            background: linear-gradient(235deg, #ffe98a, #beb1f7);
            -webkit-background-clip: text;
            background-clip:text;
            -webkit-text-fill-color: transparent;
            
        }
        div.slogan:hover{
            transform: scale(1.2);
            text-shadow: -2px 5px 1px #7a7a7a;
        }
        @media(max-width:576px){
            div.slogan{
                width: 40%;
            }
        }
        h1{
            text-align: center;
            font-family: '黑体';
            font-size: 60px;
            margin: 0%;
            text-shadow: 0 5px 10px #918b8b;
            -webkit-background-clip: text;
            background-clip:text;
            color: #f7e6b0;
        }
        .link{
            text-align: center;
            font-size: 12px;
            color: #a0f334;
            font-family: '华文彩云';
        }
        .move_meme{
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
        }
        .scroll{
            background-color: #918b8b;
            display: flex;  
            width:980px;
            overflow: hidden;
            border: 2px solid #ddd;
            position: relative;
        }
        .img_list{
            display: flex;
            animation: scroll 5s linear infinite;
        }
        .img_list img{
            height: 100px;
            width: 100px;
            margin-right: 10px; 
        }
        @keyframes scroll{
            from{
                transform: translateX(0);
            }
            to{
                transform: translateX(-33.333%);
            }
        }
        .jump{
            margin: 20px;
            animation: jump 2s ease infinite;
        }
        .jump img{
            width: 70px;
            height: 70px;
        }
        @keyframes jump{
            0%{transform: translateY(0) rotate(0);}
            0%{transform: translateY(-50px) rotate(180deg);}
            0%{transform: translateY(0) rotate(360deg);}
        }
        .content1{
            display: grid;
            grid-template-columns: 220px 0.9fr 1.5fr 1fr 2fr 200px;
            grid-template-rows: auto 1fr auto;
            background: linear-gradient(180deg, #cab0ee, #ffe23f);
        }
        @media (max-width:576px){
            .content1{
                grid-template-columns: 1fr;
            }
            .content1 img{
                max-width: 100%;
            }
        }
        .content1Head{
            grid-column: 1/-1;
            background:#d8c8ee;
            text-align: center;
            color: #ffe98a;
        }
        .content1foot{
            grid-column: 1/-1;
            background:#ffe98a;
            text-align: center;
            color: #d8c8ee;
        }
        .content1 img{
            height: 200px;

        }

            margin: 10px;

        @keyframes roll{
            0%,10%{
                transform: translateX(0);
            }
            20%,30%{
                transform: translateX(-520px);
            }
            40%,50%{
                transform: translateX(-1040px);
            }
            60%,70%{

            }
            80%,90%{
